bilstm_text:
  vocab_size: 5000
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  dense_dim: 64
  learning_rate: 0.01
  batch_size: 32
  epochs: 6
  early_stopping_patience: 2
  device: "auto"

acoustic_cnn_bigru:
  sample_rate: 8000
  n_mels: 80
  n_fft: 512
  hop_length: 160
  win_length: 400
  f_min: 300.0
  f_max: 3400.0
  cnn_channels: [32, 64, 128]
  kernel_size: 3
  gru_hidden_dim: 128
  gru_num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 32
  epochs: 15
  early_stopping_patience: 3

fusion:
  strategy: "gated"  # "late" or "gated"
  late_fusion_weights:
    text: 0.55
    audio: 0.45
  gated_hidden_dim: 64
  temperature: 1.0

early_detection:
  window_seconds: 5.0
  hop_seconds: 5.0
  fraud_threshold: 0.75
  consecutive_windows: 2
